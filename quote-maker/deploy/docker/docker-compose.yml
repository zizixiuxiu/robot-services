name: quote-maker

services:
  quote-maker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      additional_contexts:
        # 公共库在仓库根目录（构建上下文之外）
        factory-common: ../../..
    container_name: quote-maker-8007
    ports:
      - "8007:8007"
    volumes:
      - ../../src:/app/src:ro
      - ../../../factory-common/factory_common:/app/factory_common:ro
      - ../../data/output:/app/data/output
      - ../../logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_DIR=/app/logs
      - OUTPUT_BASE=/app/data/output
      - QUOTE_TEMPLATE=/app/src/templates/quote_template.xlsx
      - QUOTE_MAX_WORKERS=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
