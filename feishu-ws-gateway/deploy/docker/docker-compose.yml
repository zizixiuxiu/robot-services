name: feishu-ws-gateway

services:
  feishu-ws-gateway:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: feishu-ws-gateway
    volumes:
      - ../../src:/app/src:ro
      - ../../logs:/app/logs
    env_file:
      - ../../.env
    environment:
      - PYTHONUNBUFFERED=1
      - FEISHU_LOG_FILE=/app/logs/feishu_bot_ws.log
      - HTTP_SERVICE_HOST=host.docker.internal
      - FEISHU_APP_ID=${FEISHU_APP_ID:-cli_a96f57b08d3bdbd8}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os,sys; sys.exit(0 if any(b'feishu_bot_ws' in open('/proc/'+p+'/cmdline','rb').read() for p in os.listdir('/proc') if p.isdigit()) else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
