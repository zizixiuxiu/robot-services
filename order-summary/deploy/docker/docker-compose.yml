name: order-summary

services:
  order-summary:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      additional_contexts:
        factory-common: ../../..   # 仓库根目录（公共库）
    container_name: order-summary-8011
    ports:
      - "0.0.0.0:8011:8011"
    volumes:
      - ../../src:/app/src:ro
      - ../../../factory-common/factory_common:/app/factory_common:ro
      - ../../data/output:/app/data/output
      - ../../logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
      - OUTPUT_BASE=/app/data/output
      - LOG_DIR=/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
