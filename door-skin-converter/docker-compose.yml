services:
  door-sheet-converter:
    build: .
    container_name: door-skin-converter-8010
    restart: unless-stopped
    ports:
      - "8010:8010"
    environment:
      MAX_UPLOAD_BYTES: "52428800"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

