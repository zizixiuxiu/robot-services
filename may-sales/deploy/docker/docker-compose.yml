name: may-sales

services:
  dealer-sales:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      additional_contexts:
        # 公共库在仓库根目录（构建上下文之外）
        factory-common: ../../..
    container_name: dealer-sales-8003
    ports:
      - "8003:8003"
    volumes:
      # 代码文件挂载，便于热更新
      - ../../src/dealer_sales_http.py:/app/dealer_sales_http.py:ro
      - ../../src/generate_may_sales_report.js:/app/generate_may_sales_report.js:ro
      - ../../src/generate_dealer_sales_report.js:/app/generate_dealer_sales_report.js:ro
      - ../../src/templates:/app/templates:ro
      - ../../config/package.json:/app/package.json:ro
      # 公共库 factory-common（仓库根目录，宿主机改代码即生效）
      - ../../../factory-common/factory_common:/app/factory_common:ro
      # 输出目录挂载，便于调试查看
      - ../../data/output_may_sales:/app/output_may_sales
      # 销量累积表（2026 月度数据，每月递增持久化）
      - ../../data/sales_state:/app/sales_state
      - ../../logs:/app/logs
    environment:
      # 默认模板；如需使用本地默认模板，可挂载并设置此变量
      - DEFAULT_TEMPLATE=/app/templates/2026年5月销售部业绩核对表 - 副本.xlsx
      - SALES_TEMPLATE=/app/templates/2026年奢匠各经销商销量情况_模板.xlsx
      - SALES_ACCUMULATOR=/app/sales_state/销量累计_2026.xlsx
      - OUTPUT_DIR=/app/output_may_sales
      - LOG_DIR=/app/logs
      - PYTHONUNBUFFERED=1
    working_dir: /app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
